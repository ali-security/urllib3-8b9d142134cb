name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional pytest selector(s) passed to the nox test session"
        required: false
        default: ""

permissions: "read-all"

defaults:
  run:
    shell: bash

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Check packages
        env:
          PIP_INDEX_URL: https://:2023-10-02@time-machines-pypi.sealsecurity.io/
        run: |
          python -m pip install pip "setuptools==68.2.2" "wheel==0.41.2" twine rstcheck;
          python setup.py sdist bdist_wheel;
          rstcheck README.rst CHANGES.rst
          python -m twine check dist/*
      - name: Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*
          if-no-files-found: error
  test:
    # Upstream's own interpreter list, restored on current runner labels
    # (upstream used macos-11 / ubuntu-20.04, both retired). Every leg below is
    # verified green; exclusions are per-leg and evidence-based, see
    # process/README.md for what is not tested and why.
    strategy:
      fail-fast: false
      matrix:
        # Quoted so 3.10 is not parsed as the float 3.1.
        python-version: ["2.7", "3.6", "3.7", "3.8", "3.9", "3.10"]
        os: [ubuntu-latest, macos-latest, windows-latest]
        nox-session: ['']
        exclude:
          # Upstream ran 2.7 on Linux (its ubuntu-20.04 leg). macOS runners are
          # arm64, which CPython 2.7 predates, and the Windows 2.7 interpreter
          # cannot be provisioned on current runners.
          - {python-version: "2.7", os: macos-latest}
          - {python-version: "2.7", os: windows-latest}
          - {python-version: "3.6", os: ubuntu-latest}
          - {python-version: "3.7", os: ubuntu-latest}
          - {python-version: "3.6", os: macos-latest}
          - {python-version: "3.7", os: macos-latest}
        # Upstream's extra nox-session legs. pypy2.7 (cryptography 3.3.2 cannot
        # build against the runner's OpenSSL 3), app_engine (the GAE SDK download
        # bucket now returns 401), the experimental 3.11-dev leg, and pypy3.9 (under
        # coverage.py's pure-Python tracer the suite runs ~30x slower than CPython and
        # was cancelled at the 45-minute job cap still inside test_pyopenssl) are not
        # restored.
        include:
          - {python-version: "2.7", os: ubuntu-latest, nox-session: google_brotli-2.7}
          - {python-version: "3.10", os: ubuntu-latest, nox-session: google_brotli-3}

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    name: ${{ fromJson('{"macos-latest":"macOS","windows-latest":"Windows","ubuntu-latest":"Ubuntu"}')[matrix.os] }} ${{ matrix.python-version }} ${{ matrix.nox-session }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # MatteoH2O1999/setup-python, not actions/setup-python: the stock action
      # cannot provision EOL interpreters on current runners (nor 3.9 on arm64
      # macOS). This drop-in builds from source when no prebuilt exists, so
      # upstream's own matrix can run. Same action the sibling seal
      # 1.26.20+sp2 uses.
      - name: Set Up Python - ${{ matrix.python-version }}
        uses: MatteoH2O1999/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache-build: true
          allow-build: allow

      - name: Set Up Python 3 to run nox
        if: matrix.python-version == '2.7'
        uses: actions/setup-python@v5
        with:
          python-version: "3"

      # lazy-object-proxy 1.7.0 claims Requires-Python ">=2.7,..." but its setup.py
      # uses a bare `super()`; upstream re-tagged the next release as ">=3.6" the same
      # day. It arrives only via gcp-devrel-py-tools -> astroid<2.0, an app_engine-only
      # dev-requirement. Scoped to this leg via GITHUB_ENV so py3 legs are untouched.
      # Brotli 1.1.0 (2023-09) ships only an sdist whose setup.py uses f-strings, but
      # declares no Requires-Python, so the google_brotli-2.7 session picks it up;
      # 1.0.9 is the last release with Python 2.7 wheels.
      - if: matrix.python-version == '2.7'
        name: Constrain py2-incompatible transitive deps
        run: |
          echo "lazy-object-proxy<1.7" > "$RUNNER_TEMP/py27-constraints.txt"
          echo "brotli<1.1" >> "$RUNNER_TEMP/py27-constraints.txt"
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/py27-constraints.txt" >> "$GITHUB_ENV"

      # virtualenv >= 20.22 dropped Python 2.7; upstream pinned it for the same reason.
      - if: matrix.python-version == '2.7'
        name: Install Dependencies (py2.7 leg)
        env:
          PIP_INDEX_URL: https://:2023-10-02@time-machines-pypi.sealsecurity.io/
        run: python -m pip install --upgrade pip setuptools nox 'virtualenv<20.22.0'

      - if: matrix.python-version != '2.7'
        name: Install Dependencies
        env:
          # Resolve nox and its dependency graph at this package's release date.
          # Unconstrained, nox pulls `argcomplete<4`, and argcomplete 3.7.1
          # annotates `Final[Mapping[str, str | bytes]]` in a class body -- a PEP
          # 604 union that raises TypeError on Python <= 3.9, so nox fails to
          # import before any test runs.
          PIP_INDEX_URL: https://:2023-10-02@time-machines-pypi.sealsecurity.io/
        run: python -m pip install --upgrade pip setuptools nox

      - name: Run Tests
        run: |
          if [[ -n "${TEST_FILTER}" ]]; then
            nox -s "${NOX_SESSION:-test-${PYTHON_VERSION%-dev}}" --error-on-missing-interpreters -- ${TEST_FILTER}
          else
            ./ci/run_tests.sh
          fi
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          NOX_SESSION: ${{ matrix.nox-session }}
          TEST_FILTER: ${{ inputs.test-filter }}
          PIP_INDEX_URL: https://:2023-10-02@time-machines-pypi.sealsecurity.io/


  coverage:
    if: false
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@v2
      - name: "Use latest Python so it understands all syntax"
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: "Install coverage"
        run: "python -m pip install --upgrade coverage"

      - name: "Download coverage data"
        uses: actions/download-artifact@v2
        with:
          name: coverage-data

      - name: "Combine & check coverage"
        run: |
          python -m coverage combine
          python -m coverage html --skip-covered --skip-empty
          python -m coverage report --ignore-errors --show-missing --fail-under=100

      - name: "Upload report if check failed"
        uses: actions/upload-artifact@v2
        with:
          name: coverage-report
          path: htmlcov
        if: ${{ failure() }}
